<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Runout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..600&family=JetBrains+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="shell">
  <header class="top">
    <h1>Runout</h1>
    <p>Pick two hands and actually run the board out a few times. Watch each runout land, then see how your results stack up against the exact odds.</p>
  </header>

  <div class="grid">
    <section class="card" id="setup" aria-label="Matchup setup">
      <div class="sec-head">
        <h2>Matchup</h2>
        <div class="presets">
          <button class="chip" data-a="AhAd" data-b="KsKc">AA vs KK</button>
          <button class="chip" data-a="AsKs" data-b="QhQd">AKs vs QQ</button>
          <button class="chip" data-a="AhKd" data-b="2c2s">AKo vs 22</button>
          <button class="chip" data-a="AsQd" data-b="AhJc">AQo vs AJo</button>
          <button class="chip" data-a="JhTh" data-b="AsAc">JTs vs AA</button>
        </div>
      </div>

      <div class="hands">
        <div class="hand a">
          <div class="hand-head"><span class="who">Hand A</span><button class="link" data-clear="A">Clear</button></div>
          <div class="notation" id="labA">—</div>
          <div class="slots" id="slotsA"></div>
        </div>
        <div class="hand b">
          <div class="hand-head"><span class="who">Hand B</span><button class="link" data-clear="B">Clear</button></div>
          <div class="notation" id="labB">—</div>
          <div class="slots" id="slotsB"></div>
        </div>
      </div>

      <div class="board-wrap">
        <div class="sec-head">
          <h3>Board <span>optional</span></h3>
          <button class="link" data-clear="board">Clear board</button>
        </div>
        <div class="board-slots" id="slotsBoard"></div>
      </div>

      <div class="board-wrap">
        <div class="picker" id="picker" aria-label="Card picker"></div>
        <p class="hint">Click a card to deal it into the highlighted slot. Click a dealt card to take it back. Four-color deck.</p>
      </div>

      <div class="runbar">
        <div class="field">
          <label for="runs">Runouts</label>
          <input id="runs" type="text" inputmode="numeric" autocomplete="off" value="5">
        </div>
        <div class="quick" id="quick">
          <button data-runs="1">1</button>
          <button data-runs="3">3</button>
          <button data-runs="5">5</button>
          <button data-runs="10">10</button>
          <button data-runs="25">25</button>
        </div>
        <button class="more" id="more">Deal 5 more</button>
        <button class="go" id="go">Run it out</button>
        <p id="msg" aria-live="polite"></p>
      </div>
    </section>

    <section class="card" id="results" aria-label="Results"></section>
  </div>
</main>

<script src="js/util.js"></script>
<script src="js/engine.js"></script>
<script src="js/cards.js"></script>
<script src="js/setup.js"></script>
<script src="js/runouts.js"></script>
<script src="js/results.js"></script>
<script src="js/main.js"></script>

</body>
</html>
